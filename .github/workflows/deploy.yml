name: Deploy to GitHub Pages

# Publishes every stage (git tags step-1, step-2, ...) as its own playable copy, plus a page listing
# them: see tools/build-stages.mjs
# (no branch trigger: a push to ballpark doesn't change the site, a new stage tag does; three tags or
# fewer per push, or GitHub skips the trigger. By hand: gh workflow run deploy.yml --ref ballpark)
on:
  push:
    tags: [ 'step-*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stage tags and their trees
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git fetch --force --tags
      - run: npm run stages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
